<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Shared pieces. Each page pulls them in with th:replace. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Thapar Grade Predictor'">Thapar Grade Predictor</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="navbar" class="navbar">
    <span class="brand">Thapar Grade Predictor</span>

    <th:block sec:authorize="hasRole('STUDENT')">
        <a th:href="@{/student}">Dashboard</a>
        <a th:href="@{/student/edit-requests}">Unlock Requests</a>
        <a th:href="@{/student/polls}">Polls</a>
    </th:block>

    <th:block sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin}">Dashboard</a>
        <a th:href="@{/admin/subjects}">Subjects</a>
        <a th:href="@{/admin/cutoffs}">Cutoffs</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/edit-requests}">Unlock Requests</a>
        <a th:href="@{/admin/polls}">Polls</a>
        <a th:href="@{/admin/analytics}">Analytics</a>
    </th:block>

    <span class="spacer"></span>
    <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<div th:fragment="flash">
    <div class="success" th:if="${success}" th:text="${success}"></div>
    <div class="failure" th:if="${failure}" th:text="${failure}"></div>
    <div class="failure" th:if="${errors}">
        <ul><li th:each="e : ${errors}" th:text="${e}"></li></ul>
    </div>
</div>
</body>
</html>
