<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Polls')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<div class="container">
    <h1>Polls</h1>
    <div th:replace="~{layout :: flash}"></div>

    <div class="card">
        <h2>Create a poll</h2>
        <form th:action="@{/admin/polls}" method="post">
            <label>Subject</label>
            <select name="subjectId" required>
                <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.code} + ' - ' + ${s.name}">UCS301</option>
            </select>
            <label>Question</label>
            <input type="text" name="question" maxlength="300" placeholder="What did you score in the MST?" required>
            <label>Duration (hours)</label>
            <input type="number" name="durationHours" min="1" max="720" value="48" required>
            <button type="submit">Create poll</button>
        </form>
        <p class="muted">To set the manual grade cutoffs for a subject, use the <a th:href="@{/admin/cutoffs}">Cutoffs</a> page.</p>
    </div>

    <table>
        <tr><th>Subject</th><th>Question</th><th>Status</th><th>Ends</th><th>Responses</th><th>Average</th><th></th></tr>
        <tr th:each="p : ${polls}">
            <td th:text="${p.subjectCode()}">UCS301</td>
            <td th:text="${p.question()}">question</td>
            <td th:text="${p.open()} ? 'Open' : 'Closed'">Open</td>
            <td th:text="${#temporals.format(p.endTime(), 'dd MMM yyyy HH:mm')}">date</td>
            <td th:text="${p.responses()}">0</td>
            <td th:text="${p.hidden()} ? '-' : ${#numbers.formatDecimal(p.average(), 1, 1)}">-</td>
            <td>
                <a th:href="@{/admin/polls/{id}/responses(id=${p.pollId()})}">Distribution</a>
                <form class="inline" th:if="${p.open()}" th:action="@{/admin/polls/{id}/close(id=${p.pollId()})}" method="post">
                    <button type="submit" class="secondary">Close</button>
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
