spring.application.name=thapar-gpf
server.port=8080

# H2 in-memory database: zero setup. Data is reset on every restart.
# For a file database that survives restarts use: jdbc:h2:file:./data/gpf
spring.datasource.url=jdbc:h2:mem:gpf;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Demo data: number of fake students who submit UCS301 marks at startup (0 = none)
gpf.seed.demo-cohort=120
