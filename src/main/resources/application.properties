spring.application.name=thapar-grade-predictor
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/grade-predictor;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
# Sessions live in the database (table SPRING_SESSION), so sign-ins survive restarts and
# work when the host runs several copies of the app (Vercel containers, Render restarts).
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
gpf.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
gpf.admin.email=${ADMIN_EMAIL:admin@thapar.edu}
gpf.demo.enabled=false
gpf.seed.demo-cohort=0
