# PostgreSQL for deployments (Neon, Render Postgres, Docker Compose).
# Either set DB_URL / DB_USER / DB_PASSWORD yourself, or let the Neon integration on Vercel
# provide PGHOST_UNPOOLED / PGDATABASE / PGUSER / PGPASSWORD and the URL is built from them.
# These properties are fallbacks. NeonDataSourceConfig also understands Vercel's POSTGRES_URL
# and extracts its host, database, username and password.
spring.datasource.url=${DB_URL:${POSTGRES_URL:jdbc:postgresql://${PGHOST_UNPOOLED:${POSTGRES_HOST:localhost:5432}}/${PGDATABASE:${POSTGRES_DATABASE:grade_predictor}}?sslmode=${PGSSLMODE:prefer}}}
spring.datasource.username=${DB_USER:${PGUSER:${POSTGRES_USER:}}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:}}}
# small pool: free database plans limit connections, and Vercel may run more than one container
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
server.servlet.session.cookie.secure=${SECURE_COOKIES:true}
# Vercel and Render end HTTPS at their proxy and pass X-Forwarded-Proto/Host.
# Spring needs them to build the https:// Google sign-in callback address.
server.forward-headers-strategy=framework
