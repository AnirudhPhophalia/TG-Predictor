<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Your profile')}"></head><body><div th:replace="~{layout :: navbar}"></div><main id="main" class="container narrow"><h1>Your profile</h1><div th:replace="~{layout :: flash}"></div><div class="card"><div class="profile-heading"><span class="avatar" th:text="${#strings.substring(student.name,0,1)}">S</span><div><h2 th:text="${student.name}"></h2><p class="muted" th:text="${student.email}"></p></div></div><div class="cards"><div class="detail-tile"><span class="eyebrow">ADMISSION YEAR</span><h3 th:text="${student.admissionYear != null ? student.admissionYear : 'Not detected'}"></h3><small>From your institute email</small></div><div class="detail-tile"><span class="eyebrow">MEMBER SINCE</span><h3 th:text="${#temporals.format(student.createdAt,'dd MMM yyyy')}"></h3><small th:text="${student.googleSubject != null ? 'Verified with Google' : 'Local demo account'}"></small></div></div><form th:action="@{/student/profile}" method="post"><label for="rollNumber">Roll number</label><input id="rollNumber" name="rollNumber" th:value="${student.rollNumber}" maxlength="30" pattern="[A-Za-z0-9-]+" required><div class="form-grid"><div><label for="branch">Branch</label><input id="branch" name="branch" th:value="${student.branch}" maxlength="50" placeholder="e.g. COE" required></div><div><label for="semester">Current semester</label><select id="semester" name="semester" required><option th:each="n:${#numbers.sequence(1,8)}" th:value="${n}" th:selected="${student.semester == n}" th:text="'Semester ' + ${n}"></option></select></div></div><button type="submit">Save profile</button></form></div><a th:href="@{/student}">Back to overview</a></main><div th:replace="~{layout :: footer}"></div></body></html>
