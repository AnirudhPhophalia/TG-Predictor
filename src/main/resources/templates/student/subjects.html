<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Explore subjects')}"></head><body><div th:replace="~{layout :: navbar}"></div><main id="main" class="container"><span class="eyebrow">FIND YOUR NEXT PERSPECTIVE</span><h1>Explore subjects</h1><p class="muted">Find your courses, contribute your marks, understand your standing.</p><form class="card filter subject-filter" th:action="@{/student/subjects}" method="get"><div><label for="search">Search subjects</label><input id="search" name="search" th:value="${search}" placeholder="Subject name, code or branch"></div><div><label for="semester">Semester</label><select id="semester" name="semester"><option value="">All semesters</option><option th:each="n:${#numbers.sequence(1,8)}" th:value="${n}" th:selected="${selectedSemester == n}" th:text="'Semester '+${n}"></option></select></div><button type="submit">Find subjects</button></form><p class="muted" th:text="${subjects.size()} + ' subjects found'"></p><div class="subject-grid"><article class="card subject-card" th:each="s:${subjects}"><span class="eyebrow" th:text="${s.code}"></span><h2 th:text="${s.name}"></h2><p class="muted small" th:text="${s.branch}+' · Semester '+${s.semester}+' · '+${s.credits}+' credits'"></p><a class="button secondary" th:href="@{/student/submit/{id}(id=${s.id})}">View / submit marks <span aria-hidden="true">→</span></a></article></div><div class="card empty-state" th:if="${subjects.empty}"><h2>No matching subjects</h2><p>Try another search or semester.</p></div></main><div th:replace="~{layout :: footer}"></div></body></html>
