<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Users')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main id="main" class="container">
    <span class="eyebrow">THE THAPAR COMMUNITY</span><h1>Users</h1>
    <div th:replace="~{layout :: flash}"></div>

    <div class="table-scroll"><table>
        <tr><th>Name</th><th>Email</th><th>Roll no.</th><th>Branch</th><th>Sem</th><th>Role</th><th>Joined</th><th></th></tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.name()}">Name</td>
            <td th:text="${u.email()}">email</td>
            <td th:text="${u.rollNumber()}">roll</td>
            <td th:text="${u.branch()}">COE</td>
            <td th:text="${u.semester()}">5</td>
            <td th:text="${u.role()}">STUDENT</td>
            <td th:text="${#temporals.format(u.createdAt(), 'dd MMM yyyy')}">date</td>
            <td><span class="badge" th:text="${u.email().equalsIgnoreCase(adminEmail) ? 'Configured administrator' : 'Student access'}"></span></td>
        </tr>
    </table></div>
    <nav th:replace="~{layout :: pager(${users}, @{/admin/users}, 'page')}"></nav>
</main>
<div th:replace="~{layout :: footer}"></div></body>
</html>
