<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Unlock Requests')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main id="main" class="container">
    <h1>Unlock requests</h1>
    <div th:replace="~{layout :: flash}"></div>

    <p class="muted" th:if="${requests.empty}">No requests yet.</p>
    <table th:unless="${requests.empty}">
        <tr><th>Student</th><th>Subject</th><th>Reason</th><th>Sent</th><th>Status</th><th></th></tr>
        <tr th:each="r : ${requests}">
            <td><span th:text="${r.studentName()}">Name</span> <span class="muted" th:text="${r.rollNumber()}"></span></td>
            <td th:text="${r.subjectCode()} + ' - ' + ${r.subjectName()}">UCS301</td>
            <td th:text="${r.reason()}">reason</td>
            <td th:text="${#temporals.format(r.createdAt(), 'dd MMM yyyy HH:mm')}">date</td>
            <td>
                <span class="badge" th:classappend="${r.status()}" th:text="${r.status()}">PENDING</span>
                <div class="muted" th:if="${r.rejectionReason() != null}" th:text="${r.rejectionReason()}"></div>
            </td>
            <td>
                <div th:if="${r.status().name() == 'PENDING'}">
                    <form class="inline" th:action="@{/admin/edit-requests/{id}/approve(id=${r.id()})}" method="post">
                        <input type="hidden" name="page" th:value="${requests.number}">
                        <button type="submit">Approve Unlock</button>
                    </form>
                    <form class="inline" th:action="@{/admin/edit-requests/{id}/reject(id=${r.id()})}" method="post">
                        <input type="hidden" name="page" th:value="${requests.number}">
                        <input type="text" name="reason" placeholder="Rejection reason">
                        <button type="submit" class="danger">Reject</button>
                    </form>
                </div>
            </td>
        </tr>
    </table>
    <nav th:replace="~{layout :: pager(${requests}, @{/admin/edit-requests}, 'page')}"></nav>
</main>
<div th:replace="~{layout :: footer}"></div></body>
</html>
