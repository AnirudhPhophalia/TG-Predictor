<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body>
<div class="container login-box">
    <div class="card">
        <h1>Create account</h1>
        <p class="muted">Only @thapar.edu emails are accepted.</p>
        <div th:replace="~{layout :: flash}"></div>

        <form th:action="@{/register}" method="post">
            <label for="name">Full name</label>
            <input type="text" name="name" th:value="${form?.name()}" required id="name">

            <label for="email">Email</label>
            <input type="email" name="email" th:value="${form?.email()}" placeholder="you@thapar.edu" required id="email">

            <label for="password">Password (min 6 characters)</label>
            <input type="password" name="password" required id="password">

            <label for="rollNumber">Roll number</label>
            <input type="text" name="rollNumber" th:value="${form?.rollNumber()}" id="rollNumber">

            <label for="branch">Branch</label>
            <input type="text" name="branch" th:value="${form?.branch()}" placeholder="COE" id="branch">

            <label for="semester">Semester</label>
            <input type="number" name="semester" min="1" max="8" th:value="${form?.semester()}" id="semester">

            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a th:href="@{/login}">Login</a></p>
    </div>
</div>
</body>
</html>
