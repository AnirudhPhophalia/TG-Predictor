services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grade_predictor
      POSTGRES_USER: grade_predictor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - grade-predictor-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grade_predictor -d grade_predictor"]
      interval: 5s
      timeout: 5s
      retries: 10
  application:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/grade_predictor
      DB_USER: grade_predictor
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_LOGIN_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@thapar.edu}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      database:
        condition: service_healthy
volumes:
  grade-predictor-database:
